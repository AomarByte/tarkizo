<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TARKIZO</title>
<meta name="description" content="مؤقّت هادئ للدراسة والتركيز بأربع لغات، مع شاشة تركيز كاملة وأصوات طبيعية. A calm study and focus timer.">
<meta name="theme-color" content="#E7EDEB">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TARKIZO">
<style>
/* base reset (the same base the preview used) */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600&family=DM+Mono:wght@300;400&family=Fraunces:opsz,wght@9..144,300;9..144,400&family=JetBrains+Mono:wght@300;400;600&family=Baloo+Bhaijaan+2:wght@400;500;600&display=swap">
<style>
/* Layout: one calm column — a settings sheet that gives way to a single large clock while running */
:root{
  --bg:#E7EDEB; --surface:#F4F7F6; --ink:#1A2526; --muted:#596866; --line:#CCD7D4;
  --study:#2C675F; --break:#A26A2C; --on-accent:#FFFFFF;
  --accent:var(--study);
  --on-study:#FFFFFF; --on-break:#FFFFFF; --dscale:1; --thick:6px;
  --f-clock:var(--f-num);
  --f-ui:"Readex Pro","Segoe UI",Tahoma,system-ui,sans-serif;
  --f-num:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101716; --surface:#172120; --ink:#E2EBE8; --muted:#90A19E; --line:#283533;
  --study:#72B5AA; --break:#DDA463; --on-accent:#0E1615; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#101716; --surface:#172120; --ink:#E2EBE8; --muted:#90A19E; --line:#283533;
  --study:#72B5AA; --break:#DDA463; --on-accent:#0E1615; color-scheme:dark;}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  transition:background-color .6s ease;
  --on-accent:var(--on-study); --ring:var(--ring-c,var(--accent)); --digits:var(--digits-c,var(--ink))}
body[data-phase="break"]{--accent:var(--break);--on-accent:var(--on-break)}
.wrap{max-width:760px;margin:0 auto;min-height:100%;padding-block:22px 40px;display:flex;flex-direction:column;gap:22px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;flex-wrap:wrap}
.mark{font-weight:500;letter-spacing:.32em;font-size:15px;direction:ltr}
.tag{color:var(--muted);font-size:14px;margin:0;flex:1 1 auto;min-width:0}
.lang{display:flex;align-items:center;gap:6px;color:var(--muted)}
.lang svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6}
.lang select{width:auto;padding:5px 8px;font-size:14px;background:var(--surface)}

.sheet{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.sec{padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.sec+.sec{border-top:1px solid var(--line)}
.lbl{font-size:13px;color:var(--muted);margin:0;font-weight:500}
.hint{font-size:13px;color:var(--muted);margin:0}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;display:inline-flex;gap:8px;align-items:baseline;transition:background-color .2s,border-color .2s}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip .n{font-family:var(--f-num);font-size:13px;opacity:.8;direction:ltr;unicode-bidi:isolate}

.times{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.time{display:flex;flex-direction:column;gap:6px;min-width:0}
.time-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;width:4.5ch;text-align:center;padding:8px 6px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:18px}
.num.wide{width:5.5ch}
.unit{font-size:13px;color:var(--muted)}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.opt input{margin-top:6px;accent-color:var(--accent)}
.opt span{display:flex;flex-direction:column}
.opt small{color:var(--muted);font-size:13px}

.saved-row{display:flex;gap:8px;flex-wrap:wrap}
.saved-row input{flex:1 1 180px;min-width:0;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.btn{border:1px solid var(--line);background:transparent;border-radius:12px;padding:9px 16px;transition:border-color .2s,background-color .2s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.45;cursor:default}
.saved-list{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.saved-list li{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.saved-list button{border:0;background:transparent;padding:6px 12px}
.saved-list button.x{color:var(--muted);border-inline-start:1px solid var(--line);padding:6px 10px}
.saved-list button:hover{background:var(--bg)}

.summary{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.summary b{color:var(--ink);font-weight:500}
.start{width:100%;padding:16px;border-radius:14px;border:0;background:var(--accent);color:var(--on-accent);font-size:19px;font-weight:500;letter-spacing:.02em}
.start:hover{filter:brightness(1.06)}

/* restore banner */
.restore{border:1px solid var(--accent);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.restore p{margin:0}
.restore .row{display:flex;gap:8px;flex-wrap:wrap}

/* run screen */
.run{position:fixed;inset:0;z-index:40;background:transparent;display:grid;grid-template-rows:auto 1fr auto;gap:12px;
  padding:max(14px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  transition:background-color .6s ease}
body.focus-on{overflow:hidden}
.ftop{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}
.ficons{display:flex;gap:6px}
.icon{width:42px;height:42px;display:grid;place-items:center;border:1px solid transparent;background:transparent;border-radius:12px;color:var(--muted);padding:0}
.icon:hover,.icon[aria-expanded="true"]{color:var(--ink);border-color:var(--line);background:var(--surface)}
.icon svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;min-height:0;min-width:0}
.fbottom{display:flex;flex-direction:column;align-items:center;gap:10px}
.fade{transition:opacity .5s ease}
.run.ui-hidden .fade{opacity:0;pointer-events:none}
.run.ui-hidden{cursor:none}
.run.no-progress .bar,.run.no-progress .dots{visibility:hidden}
.fpanel{box-sizing:border-box;position:absolute;z-index:3;top:calc(max(14px,env(safe-area-inset-top,0px)) + 50px);left:max(16px,env(safe-area-inset-left,0px));
  width:min(320px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;
  display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 32px color-mix(in srgb,var(--ink) 14%,transparent)}
html[dir="ltr"] .fpanel{left:auto;right:max(16px,env(safe-area-inset-right,0px))}
.fpanel .row{display:flex;gap:8px;flex-wrap:wrap}
.fsnote{box-sizing:border-box;position:absolute;z-index:4;left:50%;transform:translateX(-50%);bottom:calc(max(20px,env(safe-area-inset-bottom,0px)) + 120px);
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:10px 14px;font-size:14px;width:max-content;max-width:calc(100% - 32px)}

/* mini bar: session keeps running while the full interface is open */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.mini{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--accent);border-radius:14px;padding:10px 14px}
.mini-phase{color:var(--accent);font-weight:500;font-size:14px}
.mini-clock{font-family:var(--f-num);font-weight:400;font-size:24px;direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.mini-btns{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}
.phase{margin:0;font-size:17px;color:var(--accent);font-weight:500;letter-spacing:.02em}
.clock{font-family:var(--f-clock);font-weight:300;font-variant-numeric:tabular-nums;color:var(--digits);
  font-size:min(calc(var(--dscale) * clamp(84px,min(24vw,42vh),340px)),30vw);line-height:1;transition:opacity .3s;letter-spacing:-.03em;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.clock.long{font-size:min(calc(var(--dscale) * clamp(60px,min(16.5vw,34vh),260px)),21vw)}
.run.is-paused .clock{opacity:.45}
.bar{width:min(100%,460px);height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.fill{height:100%;background:var(--ring);transform:scaleX(0);transform-origin:right;transition:transform .25s linear}
html[dir="ltr"] .fill{transform-origin:left}
.dots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:460px}
.dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--accent);opacity:.55}
.dot.is-done{background:var(--accent);opacity:1}
.dot.is-now{opacity:1;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.meta{margin:0;color:var(--muted);font-size:14px}
.msg{margin:0;color:var(--muted);max-width:36ch;font-size:15px}
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.controls .btn.primary{min-width:9.5em;padding:12px 22px;font-size:17px}
.controls.small .btn{font-size:14px;padding:7px 13px;color:var(--muted)}
.controls.small .btn:hover{color:var(--ink)}
.btn.warn{border-color:var(--accent);color:var(--ink)}
.mono{font-family:var(--f-num);direction:ltr;unicode-bidi:isolate}

/* countdown overlay */
.cd{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 84%,transparent);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
.cd p{margin:0;color:var(--muted)}
.cd-num{font-family:var(--f-clock);font-weight:300;font-size:clamp(120px,42vw,300px);line-height:1;color:var(--accent);direction:ltr}
.cd-num.word{font-family:var(--f-ui);font-weight:500;font-size:clamp(56px,16vw,120px)}
.pop{animation:pop .5s ease-out}
@keyframes pop{from{opacity:.15;transform:scale(.86)}to{opacity:1;transform:scale(1)}}

/* done */
.done{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;padding-block:40px}
.done h2{margin:0;font-weight:500;font-size:26px;text-wrap:balance}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;width:100%}
.stats div{background:var(--surface);padding:14px 8px;display:flex;flex-direction:column;gap:4px}
.stats b{font-family:var(--f-num);font-weight:400;font-size:20px;direction:ltr;unicode-bidi:isolate}
.stats span{font-size:13px;color:var(--muted)}

/* ambient scene drawn behind everything */
#scene{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block}
.wrap{position:relative;z-index:1}
body.focus-on header{visibility:hidden}

/* settings tabs */
.tabs{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--line)}
.tab{flex:1;border:0;background:transparent;border-radius:10px;padding:9px 12px;color:var(--muted);font-weight:500}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--bg);color:var(--ink)}
#startSec{border-top:1px solid var(--line)}

/* clock faces — one markup, six styles */
.face{position:relative;display:flex;align-items:center;justify-content:center;gap:clamp(16px,4vw,36px);max-width:100%}
.dial,.vbar{display:none}
[data-style="ring"] .face,[data-style="progress"] .face{width:min(78vw,56vh,500px);aspect-ratio:1;container-type:size}
[data-style="ring"] .dial,[data-style="progress"] .dial{display:block;position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
[data-style="ring"] .clock,[data-style="progress"] .clock{font-size:calc(19cqw * var(--dscale))}
[data-style="ring"] .clock.long,[data-style="progress"] .clock.long{font-size:calc(13.5cqw * var(--dscale))}
[data-style="ring"] .bar,[data-style="progress"] .bar,[data-style="huge"] .bar,
[data-style="minimal"] .bar,[data-style="minimal"] .dots,[data-style="minimal"] .phase{display:none}
[data-style="bar"][data-bardir="v"] .bar{display:none}
[data-style="bar"][data-bardir="v"] .vbar{display:block}
[data-style="bar"] .bar{height:max(6px,var(--thick));width:min(100%,560px)}
[data-style="bar"] .clock{font-size:min(calc(var(--dscale) * clamp(64px,min(18vw,32vh),250px)),27vw)}
[data-style="bar"] .clock.long{font-size:min(calc(var(--dscale) * clamp(48px,min(12.5vw,26vh),190px)),19vw)}
[data-style="huge"] .clock{font-size:min(calc(var(--dscale) * min(31vw,62vh)),31vw)}
[data-style="huge"] .clock.long{font-size:min(calc(var(--dscale) * min(21vw,44vh)),21.5vw)}
[data-style="huge"] .phase{font-size:14px}
.track{fill:none;stroke:var(--line);stroke-width:var(--thick)}
.arc{fill:none;stroke:var(--ring);stroke-width:var(--thick);stroke-linecap:round;stroke-dasharray:515.22;transition:stroke-dashoffset .3s linear}
.ticks line{stroke:var(--muted);stroke-width:1;opacity:.45;stroke-linecap:round}
.ticks line.major{stroke-width:2;opacity:.75}
[data-style="progress"] .ticks{display:none}
.vbar{width:max(8px,var(--thick));height:min(44vh,340px);border-radius:999px;background:var(--line);overflow:hidden}
.vfill{width:100%;height:100%;background:var(--ring);transform:scaleY(0);transform-origin:bottom;transition:transform .3s linear}

/* appearance tab */
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.th{border:1px solid var(--line);border-radius:14px;padding:0;overflow:hidden;background:var(--surface);text-align:start;display:flex;flex-direction:column}
.th:hover{border-color:var(--accent)}
.th[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
.th-sw{height:66px;display:flex;align-items:center;justify-content:center;position:relative}
.th-sw b{font-weight:300;font-size:25px;direction:ltr;letter-spacing:-.02em}
.th-sw i{position:absolute;inset-inline-end:8px;bottom:8px;width:10px;height:10px;border-radius:50%}
.th-name{padding:7px 10px;font-size:13px}
.pvbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border:1px dashed var(--accent);border-radius:12px;padding:10px 12px}
.pvbar span{flex:1 1 160px}
.pvbox{border:1px solid var(--line);border-radius:14px;min-height:250px;padding:18px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:linear-gradient(180deg,var(--bg),color-mix(in srgb,var(--bg) 88%,var(--accent)));overflow:hidden}
.pvbox .clock{font-size:calc(var(--dscale) * 58px)}
.pvbox[data-style="huge"] .clock{font-size:calc(var(--dscale) * 84px)}
.pvbox[data-style="bar"] .clock{font-size:calc(var(--dscale) * 46px)}
.pvbox[data-style="ring"] .face,.pvbox[data-style="progress"] .face{width:176px}
.pvbox[data-style="ring"] .clock,.pvbox[data-style="progress"] .clock{font-size:calc(19cqw * var(--dscale))}
.pvbox .vbar{height:130px}
.pvbox .bar{width:min(100%,300px)}
.pvbox .phase{font-size:14px}
.field{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;font-size:14px}
.field input[type="range"]{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.field output{font-family:var(--f-num);font-size:13px;color:var(--muted);direction:ltr;unicode-bidi:isolate}
.colors{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.color{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:6px 8px;min-width:0}
.color input[type="color"]{width:34px;height:30px;border:0;padding:0;background:none;cursor:pointer;flex:none}
.color label{flex:1;font-size:14px;min-width:0;cursor:pointer}
.color button{border:0;background:none;color:var(--accent);font-size:13px;padding:4px 6px;border-radius:8px}
.color button:disabled{color:var(--muted);opacity:.6;cursor:default}
html.calm *{animation:none!important;transition:none!important}

/* home: the clock is the page */
.home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;min-height:0}
.hero{container-type:inline-size;width:100%;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.hero .clock{font-size:min(calc(var(--dscale) * 21cqw), calc(var(--dscale) * 30vh))}
.hero .clock.long{font-size:min(calc(var(--dscale) * 14.5cqw), calc(var(--dscale) * 21vh))}
.hero[data-style="huge"] .clock{font-size:min(calc(var(--dscale) * 27cqw), calc(var(--dscale) * 38vh))}
.hero[data-style="huge"] .clock.long{font-size:min(calc(var(--dscale) * 18.5cqw), calc(var(--dscale) * 26vh))}
.hero[data-style="bar"] .clock{font-size:min(calc(var(--dscale) * 17cqw), calc(var(--dscale) * 26vh))}
.hero[data-style="ring"] .face,.hero[data-style="progress"] .face{width:min(76cqw,50vh,430px)}
.hero[data-style="ring"] .clock,.hero[data-style="progress"] .clock{font-size:calc(19cqw * var(--dscale))}
.hero[data-style="ring"] .clock.long,.hero[data-style="progress"] .clock.long{font-size:calc(13.5cqw * var(--dscale))}
.hero .vbar{height:min(34vh,260px)}
.hero .bar{width:min(100%,460px)}
.hidle{display:flex;flex-direction:column;align-items:center;gap:16px;width:min(100%,460px)}
.hchips{justify-content:center}
.hidle .summary{justify-content:center;gap:4px 14px}
.setbtn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;background:var(--surface)}
.setbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round}
.setbtn[aria-expanded="true"]{border-color:var(--accent)}

/* ---- skins: the two showcase themes change more than colours ---- */
.bloom{display:none}
.bloom ellipse{fill:var(--ring)}
.bloom .bc{fill:#FFE08A}
.statusbar{display:none}
.th{position:relative}
.th-badge{position:absolute;top:6px;inset-inline-start:6px;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:500}

/* Code: calm, only the shapes change */
body[data-skin="code"] .btn,body[data-skin="code"] .chip,body[data-skin="code"] .mixname{border-radius:8px}
body[data-skin="code"] .start{border-radius:10px}

/* Rose garden */
body[data-skin="rose"]{--f-ui:"Baloo Bhaijaan 2","Readex Pro","Segoe UI",system-ui,sans-serif}
body[data-skin="rose"] .phase::before,body[data-skin="rose"] .phase::after{content:"✿";margin:0 .45em;opacity:.7}
body[data-skin="rose"] .clock{font-weight:500;letter-spacing:-.01em;text-shadow:0 6px 30px color-mix(in srgb,var(--accent) 30%,transparent)}
body[data-skin="rose"] .start,body[data-skin="rose"] .btn.primary,body[data-skin="rose"] .chip[aria-pressed="true"],body[data-skin="rose"] .mixname[aria-pressed="true"]{
  background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 62%,#FFFFFF));border-color:transparent;
  box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 32%,transparent)}
body[data-skin="rose"] .start{border-radius:999px}
body[data-skin="rose"] .sheet,body[data-skin="rose"] .th,body[data-skin="rose"] .btn,body[data-skin="rose"] .chip{border-color:color-mix(in srgb,var(--accent) 22%,var(--line))}
body[data-skin="rose"] [data-style="ring"] .bloom,body[data-skin="rose"] [data-style="progress"] .bloom{display:block}
body[data-skin="rose"] .dot{border-radius:50% 50% 50% 0;transform:rotate(-45deg)}
html[dir="rtl"] body[data-skin="rose"] .dot{border-radius:50% 50% 0 50%;transform:rotate(45deg)}
body.dragging,body.dragging *{transition:none!important}

/* tasks */
.taskline{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:7px 16px;color:var(--muted);font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.taskline:hover{border-color:var(--accent);color:var(--ink)}
.taskline.has{border-style:solid;color:var(--ink);background:var(--surface)}
.ftask{margin:0;color:var(--muted);font-size:15px;max-width:min(90vw,520px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.taskform{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center}
.taskform input[type="text"]{min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.tgt{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.tgt .num{width:3.6ch;padding:7px 4px;font-size:15px}
.tasklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 10px;background:var(--bg)}
.task.current{border-color:var(--accent)}
.tk-pick{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:transparent;padding:0;flex:none}
.tk-pick[aria-pressed="true"]{border-color:var(--accent);background:radial-gradient(circle,var(--accent) 0 5px,transparent 6px)}
.tk-name{border:0;background:none;padding:0;text-align:start;font-size:15px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%}
.tk-prog{display:flex;align-items:center;gap:8px;margin-top:4px}
.tk-bar{flex:1;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.tk-bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.tk-n{font-size:12px;color:var(--muted);font-family:var(--f-num)}
.tk-n.ok{color:var(--accent)}
.tk-act{display:flex;gap:2px}
.tk-act button{width:32px;height:32px;border:0;background:transparent;border-radius:8px;color:var(--muted);display:grid;place-items:center;padding:0}
.tk-act button:hover{background:var(--surface);color:var(--ink)}
.tk-act button:disabled{opacity:.3;cursor:default;background:transparent}
.tk-act svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tk-more{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;padding-top:6px}
.tk-more textarea{font:inherit;font-size:14px;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;resize:vertical;min-height:60px}
.tk-more .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.task.done-t .tk-name{text-decoration:line-through;color:var(--muted)}
@media (max-width:440px){ .taskform{grid-template-columns:minmax(0,1fr) auto} .taskform input[type="text"]{grid-column:1/-1} }

/* progress page */
.statsv{display:flex;flex-direction:column;gap:14px;padding-bottom:20px}
.sv-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sv-head h2{margin:0;font-weight:500;font-size:24px}
.empty{margin:0;padding:14px 16px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);background:var(--surface)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi span{font-size:13px;color:var(--muted)}
.kpi b{font-weight:500;font-size:21px;font-variant-numeric:tabular-nums}
.kpi small{font-size:12px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.goal-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.goal-text{margin:0;font-size:16px}
.gbar{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.gbar i{display:block;height:100%;width:0;background:var(--accent);border-radius:8px;transition:width .4s}
.chartbox{overflow:hidden;min-width:0}
#chart{display:block;width:100%;height:auto;touch-action:pan-y}
#chart text{fill:var(--muted);font:11px var(--f-ui)}
#chart .grid{stroke:var(--line);stroke-width:1}
#chart .goal{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:4 4;opacity:.55}
#chart .barm{fill:var(--accent);transition:opacity .15s}
#chart.hovering .barm{opacity:.45}
#chart.hovering .barm.on{opacity:1}
#chart .hit{fill:transparent;cursor:pointer}
#chart text,#chart .goal,#chart .grid{pointer-events:none}
.chart-read{margin:0;min-height:1.5em;font-size:14px}
.legend{margin:0;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.legend i{width:22px;border-top:1.5px dashed var(--ink);opacity:.55}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.streak{margin:0;font-size:18px}
.bytask{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.bytask li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:14px}
.bytask li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bytask .bt-bar{grid-column:1/-1;height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.bytask .bt-bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
#dataBox::placeholder{font-family:var(--f-ui);font-size:13px}
#dataBox{font:12px/1.45 var(--f-num);color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;box-sizing:border-box;resize:vertical;min-width:0}
.card .row{display:flex;gap:8px;flex-wrap:wrap}
.filebtn{position:relative;overflow:hidden;cursor:pointer}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.setbtn[aria-pressed="true"]{border-color:var(--accent)}
@media (max-width:640px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:480px){ .setbtn span{display:none} .setbtn{padding:8px 10px} }

/* settings drawer: slides in from the side, resizable on wide screens */
:root{--dw:400px}
.drawer{position:fixed;top:0;bottom:0;inset-inline-start:0;z-index:60;width:min(var(--dw),100vw);display:flex;flex-direction:column;
  background:var(--surface);border-inline-end:1px solid var(--line);box-shadow:0 0 40px color-mix(in srgb,var(--ink) 12%,transparent);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s}
html[dir="rtl"] .drawer:not(.open){transform:translateX(102%)}
html[dir="ltr"] .drawer:not(.open){transform:translateX(-102%)}
.drawer:not(.open){visibility:hidden;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s .32s}
.dr-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 12px 10px 18px;border-bottom:1px solid var(--line)}
html[dir="rtl"] .dr-head{padding:12px 18px 10px 12px}
.dr-head b{font-weight:500;font-size:16px}
.dr-head .icon svg{stroke-width:2}
.dr-body{flex:1;overflow-y:auto;overscroll-behavior:contain}
.drawer .sheet{border:0;border-radius:0;background:transparent;overflow:visible}
.drawer .tabs{position:sticky;top:0;z-index:2;background:var(--surface)}
.dr-grip{position:absolute;top:0;bottom:0;inset-inline-end:-6px;width:12px;cursor:col-resize;touch-action:none}
.dr-grip::after{content:"";position:absolute;top:50%;inset-inline-start:4px;width:4px;height:48px;margin-top:-24px;border-radius:4px;background:var(--accent);opacity:0;transition:opacity .2s}
.drawer:hover .dr-grip::after,.dr-grip:focus-visible::after,.dr-grip.drag::after{opacity:.7}
.scrim{position:fixed;inset:0;z-index:55;background:color-mix(in srgb,var(--ink) 32%,transparent)}
body{transition:background-color .6s ease,padding .32s cubic-bezier(.2,.8,.2,1)}
@media (min-width:960px){
  .scrim{display:none!important}
  body.dr-open{padding-inline-start:calc(var(--dw) + 24px)}
  body.dr-open .run,body.dr-open .cd{inset-inline-start:var(--dw)}
}
@media (max-width:959px){
  .dr-grip{display:none}
  .drawer{width:min(440px,92vw)}
}

/* sounds tab */
.srows{display:flex;flex-direction:column;gap:8px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) auto;gap:8px;align-items:center}
.srow label{font-size:14px}
select{font:inherit;font-size:14px;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;width:100%}
.play{padding:0;width:40px;height:38px;display:grid;place-items:center;color:var(--accent)}
.play svg{width:16px;height:16px;fill:currentColor}
.stack{display:flex;flex-direction:column;gap:12px}
.ambtop{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.mixrows{display:flex;flex-direction:column;gap:6px}
.mixgroup{margin:10px 0 2px;font-size:12px;color:var(--muted);letter-spacing:.04em;font-weight:500}
.mixgroup:first-child{margin-top:0}
.mixrow{display:grid;grid-template-columns:minmax(0,10em) minmax(0,1fr) 3.2em;gap:10px;align-items:center}
.mixname{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:14px;text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mixname:hover{border-color:var(--accent)}
.mixname[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.mixrow input{width:100%;accent-color:var(--accent)}
.mixrow output{font-family:var(--f-num);font-size:13px;color:var(--muted);text-align:end;direction:ltr;unicode-bidi:isolate}
.cue{margin:0;font-size:15px;color:var(--accent);font-weight:500}
.run.warning .clock{animation:breathe 1s ease-in-out infinite}
@keyframes breathe{50%{opacity:.5}}
@media (max-width:440px){
  .srow{grid-template-columns:minmax(0,1fr) auto}
  .srow label{grid-column:1/-1}
  .mixrow{grid-template-columns:minmax(0,7.5em) minmax(0,1fr) 3em}
}

@media (max-width:440px){
  .times{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>

</head>
<body>
<canvas id="scene" dir="ltr" aria-hidden="true"></canvas>
<div class="wrap">
  <header>
    <span class="mark">TARKIZO</span>
    <p class="tag" data-t="tagline"></p>
    <div class="lang">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>
      <select id="langSel"></select>
    </div>
    <button id="openStats" class="btn setbtn" type="button" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-8M12 20V5M19 20v-12"/></svg>
      <span data-t="progress"></span>
    </button>
    <button id="openSettings" class="btn setbtn" type="button" aria-controls="drawer" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
      <span data-t="settings"></span>
    </button>
  </header>

  <div id="restore" class="restore" hidden>
    <p><b data-t="restoreTitle"></b></p>
    <p id="restoreInfo" class="hint"></p>
    <div class="row">
      <button id="restoreGo" class="btn primary" data-t="restoreResume"></button>
      <button id="restoreDrop" class="btn" data-t="restoreDiscard"></button>
    </div>
  </div>

  <!-- HOME: only the clock and how to start -->
  <main id="home" class="home">
    <div id="hero" class="hero">
      <p id="miniPhase" class="phase"></p>
      <div class="face">
        <svg class="dial" viewBox="0 0 200 200" aria-hidden="true"><g class="ticks"></g><circle class="track" cx="100" cy="100" r="82"/><circle class="arc" cx="100" cy="100" r="82"/><g class="bloom"><ellipse cx="0" cy="-5.5" rx="3.6" ry="5.4"/><ellipse cx="0" cy="-5.5" rx="3.6" ry="5.4" transform="rotate(72)"/><ellipse cx="0" cy="-5.5" rx="3.6" ry="5.4" transform="rotate(144)"/><ellipse cx="0" cy="-5.5" rx="3.6" ry="5.4" transform="rotate(216)"/><ellipse cx="0" cy="-5.5" rx="3.6" ry="5.4" transform="rotate(288)"/><circle class="bc" r="3.2"/></g></svg>
        <div class="vbar" aria-hidden="true"><div class="vfill"></div></div>
        <div id="miniClock" class="clock">25:00</div>
      </div>
      <div class="bar"><div class="fill"></div></div>
    </div>
    <button id="hTask" class="taskline" type="button"></button>
    <div id="hIdle" class="hidle">
      <div id="hPresets" class="chips hchips" role="group"></div>
      <div class="summary"><span id="sumStudy"></span><span id="sumTotal"></span></div>
      <button id="startBtn" class="start" type="button" data-t="start"></button>
    </div>
    <div id="hLive" class="controls" hidden>
      <button id="miniPause" class="btn" type="button"></button>
      <button id="miniFocus" class="btn primary" type="button" data-t="backFocus"></button>
    </div>
  </main>


  <!-- RUN -->
  <section id="run" class="run" hidden>
    <div class="ftop fade">
      <p id="meta" class="meta"></p>
      <div class="ficons">
        <button id="fsBtn" class="icon" type="button"></button>
        <button id="optBtn" class="icon" type="button" aria-expanded="false" aria-controls="fpanel"></button>
        <button id="exitFocus" class="icon" type="button"></button>
      </div>
    </div>

    <div id="fpanel" class="fpanel" role="dialog" aria-labelledby="fpanelTitle" hidden>
      <p id="fpanelTitle" class="lbl" data-t="options"></p>
      <p class="hint" data-t="adjustTime"></p>
      <div class="row">
        <button id="minus" class="btn" type="button" data-t="minus"></button>
        <button id="plus" class="btn" type="button" data-t="plus"></button>
        <button id="resetPhase" class="btn" type="button" data-t="resetPhase"></button>
      </div>
      <label class="opt"><input type="checkbox" id="fAutoHide"><span data-t="autoHide"></span></label>
      <label class="opt"><input type="checkbox" id="fProgress"><span data-t="showProgress"></span></label>
      <label class="opt"><input type="checkbox" id="fSound"><span data-t="soundRun"></span></label>
      <p class="hint" data-t="ambSec"></p>
      <div class="row"><button id="fAmb" class="btn" type="button"></button><button id="fAll" class="btn" type="button" data-t="allSettings"></button></div>
      <div class="field"><label for="fAmbVol" data-t="ambVol"></label><output id="fAmbVolOut" for="fAmbVol"></output><input id="fAmbVol" type="range" min="0" max="100" step="5"></div>
    </div>

    <div id="center" class="center">
      <p id="phase" class="phase"></p>
      <p id="fTask" class="ftask" hidden></p>
      <div class="face">
        <svg class="dial" viewBox="0 0 200 200" aria-hidden="true"><g class="ticks"></g><circle class="track" cx="100" cy="100" r="82"/><circle class="arc" cx="100" cy="100" r="82"/><g class="bloom"><ellipse cx="0" cy="-5.5" rx="3.6" ry="5.4"/><ellipse cx="0" cy="-5.5" rx="3.6" ry="5.4" transform="rotate(72)"/><ellipse cx="0" cy="-5.5" rx="3.6" ry="5.4" transform="rotate(144)"/><ellipse cx="0" cy="-5.5" rx="3.6" ry="5.4" transform="rotate(216)"/><ellipse cx="0" cy="-5.5" rx="3.6" ry="5.4" transform="rotate(288)"/><circle class="bc" r="3.2"/></g></svg>
        <div class="vbar" aria-hidden="true"><div class="vfill"></div></div>
        <div id="clock" class="clock" role="timer">25:00</div>
      </div>
      <div class="bar"><div id="fill" class="fill"></div></div>
      <div id="dots" class="dots" aria-hidden="true"></div>
      <p id="msg" class="msg" hidden></p>
      <p id="cue" class="cue" role="status" hidden></p>
    </div>

    <div class="fbottom fade">
      <div class="controls">
        <button id="pause" class="btn primary" type="button"></button>
      </div>
      <div class="controls small">
        <button id="skip" class="btn" type="button"></button>
        <button id="end" class="btn" type="button" data-t="end"></button>
      </div>
    </div>

    <div id="fsNote" class="fsnote" role="status" hidden>
      <span id="fsNoteText"></span>
      <button id="fsRetry" class="btn primary" type="button" data-t="fsTry"></button>
    </div>
  </section>

  <!-- PROGRESS -->
  <section id="statsView" class="statsv" hidden>
    <div class="sv-head"><h2 data-t="progress"></h2><button id="statsBack" class="btn" type="button" data-t="backHome"></button></div>
    <div id="perChips" class="chips" role="group"></div>
    <p id="statsEmpty" class="empty" data-t="emptyStats" hidden></p>
    <div class="kpis">
      <div class="kpi"><span data-t="kTime"></span><b id="kTime"></b></div>
      <div class="kpi"><span data-t="kSessions"></span><b id="kSessions"></b></div>
      <div class="kpi"><span data-t="kLongest"></span><b id="kLongest"></b></div>
      <div class="kpi"><span data-t="kRounds"></span><b id="kRounds"></b><small data-t="kRoundsHint"></small></div>
    </div>
    <div class="card">
      <div class="goal-top"><p class="lbl" data-t="goalLbl"></p><div id="goalChips" class="chips" role="group"></div></div>
      <p id="goalText" class="goal-text"></p>
      <div class="gbar" aria-hidden="true"><i id="goalFill"></i></div>
      <p id="goalPer" class="hint"></p>
    </div>
    <div class="card">
      <div class="goal-top"><p id="chartTitle" class="lbl"></p><p id="chartGoal" class="legend"><i aria-hidden="true"></i><span></span></p></div>
      <p id="chartRead" class="chart-read" aria-live="polite"></p>
      <div id="chartBox" class="chartbox"><svg id="chart" dir="ltr" aria-hidden="true"></svg></div>
      <table id="chartTable" class="sr"></table>
    </div>
    <div id="streakCard" class="card">
      <p class="lbl" data-t="streak"></p>
      <p class="streak"><b id="streakNow"></b> <span id="streakBest" class="hint"></span></p>
    </div>
    <div id="taskCard" class="card"><p class="lbl" data-t="byTask"></p><ul id="byTask" class="bytask"></ul></div>
    <div class="card">
      <label class="opt"><input type="checkbox" id="showStreak"><span data-t="showStreak"></span></label>
      <label class="opt"><input type="checkbox" id="focusStat"><span data-t="focusStat"></span></label>
    </div>
    <div class="card">
      <p class="lbl" data-t="dataSec"></p>
      <p class="hint" data-t="dataNote"></p>
      <div class="row">
        <button id="exportBtn" class="btn" type="button" data-t="exportBtn"></button>
        <label class="btn filebtn"><span data-t="importBtn"></span><input id="importFile" type="file" accept=".json,.txt,application/json,text/plain"></label>
      </div>
      <textarea id="dataBox" rows="4" dir="ltr" spellcheck="false"></textarea>
      <div class="row">
        <button id="importGo" class="btn" type="button" data-t="importGo"></button>
        <button id="clearBtn" class="btn" type="button" data-t="clearBtn"></button>
      </div>
      <p id="dataMsg" class="hint" role="status"></p>
    </div>
  </section>

  <!-- DONE -->
  <section id="done" class="done" hidden>
    <h2 id="doneTitle"></h2>
    <div class="stats">
      <div><b id="stStudied"></b><span data-t="stStudied"></span></div>
      <div><b id="stSessions"></b><span data-t="stSessions"></span></div>
      <div><b id="stTotal"></b><span data-t="stTotal"></span></div>
    </div>
    <p id="doneTask" class="hint" hidden></p>
    <div class="controls">
      <button id="more1" class="btn" data-t="more1"></button>
      <button id="more2" class="btn" data-t="more2"></button>
      <button id="back" class="btn primary" data-t="back"></button>
    </div>
  </section>
</div>

<div id="scrim" class="scrim" hidden></div>
<aside id="drawer" class="drawer" aria-labelledby="drTitle">

    <section class="sec">

        <label class="opt"><input type="radio" name="ending" id="endStudy" value="study"><span><span data-t="endStudy"></span><small data-t="endStudyHint"></small></span></label>

    <section class="sec">

      <p id="savedNone" class="hint" data-t="savedNone"></p>

      <p id="offlineMsg" class="hint" role="status"></p>
    </section>

        <ul id="taskList" class="tasklist"></ul>
        <p id="taskNone" class="hint" data-t="taskNone"></p>

      <section class="sec">
        <label class="opt"><input type="checkbox" id="showTaskFocus"><span data-t="showTaskFocus"></span></label>
      </section>
    </div>

/* ---------- Formatting ---------- */
function fmtClock(ms){
  const total = Math.max(0, Math.ceil(ms/1000));
  const h = Math.floor(total/3600), m = Math.floor(total%3600/60), s = total%60;
  const p = n => String(n).padStart(2,'0');
  return h ? h+':'+p(m)+':'+p(s) : p(m)+':'+p(s);
}
function fmtHuman(sec){
  sec = Math.round(sec);
  const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60, out = [];
  if (h) out.push(h+' '+t('h'));
  if (m) out.push(m+' '+t('m'));
  if (s && !h) out.push(s+' '+t('s'));
  return out.length ? out.join(' ') : t('zero');
}
function fmtShort(sec){ const m = Math.floor(sec/60), s = sec%60; return s ? m+':'+String(s).padStart(2,'0') : String(m); }

function applyText(){

}

function renderPresets(){
  const box = $('presets'), list = PRESETS.concat([{id:'custom'}]);
  if (box.children.length !== list.length) box.innerHTML = '';
  list.forEach((p, i) => {
    let b = box.children[i];
    if (!b) {
      b = document.createElement('button');
      b.type = 'button'; b.className = 'chip';
      b.innerHTML = '<span></span>' + (p.s ? '<span class="n"></span>' : '');
      b.onclick = () => {
        cfg.preset = p.id;
        if (p.s) { cfg.studySec = p.s; cfg.breakSec = p.b; }
        commit();
      };
      box.appendChild(b);
    }
    b.setAttribute('aria-pressed', String(cfg.preset === p.id));
    b.firstChild.textContent = t('p_'+p.id);
    if (p.s) b.lastChild.textContent = (p.s/60)+' / '+(p.b/60);
  });
}
// Chips are updated in place: rebuilding them while a click is in progress (e.g. after a field's change event) would swallow the click.
function renderChips(boxId, values, current, label, onPick){
  const box = $(boxId);
  if (box.children.length !== values.length) {
    box.innerHTML = '';
    values.forEach(() => { const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; box.appendChild(b); });
  }
  values.forEach((v, i) => {
    const b = box.children[i];
    b.setAttribute('aria-pressed', String(current === v));
    b.textContent = label(v);
    b.onclick = () => onPick(v);
  });
}

  const next = nextStep();

    if ((run.status === 'study' || run.status === 'break') && !run.paused && now >= run.endAt) { finishPhase(run.endAt, true); continue; }

/* ---------- Actions ---------- */
function startRun(){
  if (run && run.status !== 'done') return;          // never start two sessions
  unlockAudio();
  const now = Date.now();
  run = {status:'idle', cycle:1, total:cfg.cycles, studySec:cfg.studySec, breakSec:cfg.breakSec,
         endWithBreak:cfg.endWithBreak, cdSec:cfg.cdSec, cdMode:cfg.cdMode, sound:cfg.sound,
         studiedMs:0, studyDone:0, startedAt:now, finishedAt:0, paused:false, remain:0, seen:now,
         task:(curTaskObj() ? curTask : null)};
  statsOpen = false;

  setDrawer(false, false);
  focusView = cfg.autoFocus;
  if (cfg.snd.ambAuto && hasMix()) ambOn = true;

function togglePause(){

  else { run.remain = Math.max(0, run.endAt - now); run.paused = true; releaseWake(); }

}
function skipPhase(){

  $('hIdle').hidden = active; $('hLive').hidden = !active;
  $('done').hidden = s !== 'done' || statsOpen;

  if (!run) { document.body.removeAttribute('data-phase'); document.title = 'TARKIZO'; renderSetup(); renderHero(); }

    $('cdLabel').textContent = t(run.pending.phase === 'study' ? 'cdStudy' : 'cdBreak');

  else { $('cd').hidden = true; lastCd = ''; }

    : t('cycleOf', {c:run.cycle, n:run.total}) + ' · ' + (studiesLeft > 0 ? t('left', {n:studiesLeft}) : t('lastOne'));
  if (cfg.focusStat) $('meta').textContent += ' · ' + t('todayShort', {t:fmtHuman((todayMs() + (s === 'study' ? Math.max(0, run.dur - rem) : 0))/1000)});
  const rtk = run.task ? tasks.find(x => x.id === run.task) : null;
  $('fTask').hidden = !(cfg.showTaskFocus && rtk);
  if (rtk && $('fTask').textContent !== '✎ ' + rtk.name) $('fTask').textContent = '✎ ' + rtk.name;
  $('msg').hidden = s !== 'break'; $('msg').textContent = t('restMsg');

/* ---------- Study log (kept only on this device) ---------- */
let stats = load('stats', null);
if (!stats || !Array.isArray(stats.phases) || !Array.isArray(stats.runs)) stats = {phases:[], runs:[]};
let todayCache = null;
function dayStart(t){ const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); }
function dayKey(t){ const d = new Date(t); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function todayMs(){
  const k = dayKey(Date.now());
  if (!todayCache || todayCache.k !== k) { const from = dayStart(Date.now()); todayCache = {k, ms:stats.phases.reduce((a, x) => a + (x.t >= from ? x.ms : 0), 0)}; }
  return todayCache.ms;
}
function logStudy(ms, full, at){
  if (ms < 30000) return;                         // ignore accidental starts under 30 s
  stats.phases.push({t:at, ms:Math.round(ms), full:!!full, task:run && run.task || null});
  todayCache = null;
  if (full && run && run.task) { const tk = tasks.find(x => x.id === run.task); if (tk) { tk.done++; saveTasks(); } }
  save('stats', stats);
  if (statsOpen) renderStats();
}
function logRun(at, complete){
  const cycles = run.studyDone - (run.loggedCycles || 0);
  run.loggedCycles = run.studyDone;
  if (cycles <= 0 && !complete) return;
  stats.runs.push({t:at, cycles, complete:!!complete});
  save('stats', stats);
}

/* ---------- Progress page ---------- */
let period = load('period', 'week');
const PERIODS = ['day','week','month','all'];
function periodFrom(per){
  const d = new Date(); d.setHours(0, 0, 0, 0);
  if (per === 'week') d.setDate(d.getDate() - 6);
  else if (per === 'month') d.setDate(d.getDate() - 29);
  else if (per === 'all') return 0;
  return d.getTime();
}
function streaks(){
  const days = new Set(stats.phases.filter(x => x.full).map(x => dayKey(x.t)));
  let now = 0; const d = new Date(); d.setHours(12, 0, 0, 0);
  if (!days.has(dayKey(d.getTime()))) d.setDate(d.getDate() - 1);   // today still counts as "open"
  while (days.has(dayKey(d.getTime()))) { now++; d.setDate(d.getDate() - 1); }
  const sorted = Array.from(days).map(k => { const [y, m, dd] = k.split('-').map(Number); return new Date(y, m - 1, dd, 12).getTime(); }).sort((a, b) => a - b);
  let best = 0, run_ = 0, prev = null;
  sorted.forEach(tm => { run_ = (prev !== null && Math.round((tm - prev)/864e5) === 1) ? run_ + 1 : 1; best = Math.max(best, run_); prev = tm; });
  return {now, best};
}
function minLabel(m){ return m < 60 ? m + ' ' + t('m') : (Math.round(m/6)/10) + ' ' + t('h'); }
function chartData(){
  const wd = t('wd').split(','), bars = [];
  const msOn = (from, to) => stats.phases.reduce((a, x) => a + (x.t >= from && x.t < to ? x.ms : 0), 0);
  if (period === 'all') {
    const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - d.getDay() - 7*11);
    for (let i = 0; i < 12; i++) { const from = d.getTime(); d.setDate(d.getDate() + 7);
      const f = new Date(from); bars.push({label:f.getDate() + '/' + (f.getMonth() + 1), value:Math.round(msOn(from, d.getTime())/60000), today:i === 11}); }
    return {bars, goal:cfg.goal*7, weekly:true};
  }
  const n = period === 'month' ? 30 : 7, d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (n - 1));
  for (let i = 0; i < n; i++) { const from = d.getTime(), day = new Date(from); d.setDate(d.getDate() + 1);
    bars.push({wd:n === 7 ? day.getDay() : undefined, label:n === 7 ? wd[day.getDay()] : String(day.getDate()), long:wd[day.getDay()] + ' ' + day.getDate() + '/' + (day.getMonth() + 1),
               value:Math.round(msOn(from, d.getTime())/60000), today:i === n - 1}); }
  return {bars, goal:cfg.goal, weekly:false};
}
function drawChart(){
  const {bars, goal, weekly} = chartData(), svg = $('chart'), NS = 'http://www.w3.org/2000/svg';
  $('chartTitle').textContent = t(weekly ? 'chartWeeks' : 'chartTitle');
  // Arabic reads right to left, so time runs right to left and the value axis sits on the right
  const rtl = root.dir === 'rtl', AX = 42, EDGE = 8;
  const W = Math.max(260, Math.round($('chartBox').clientWidth || 600)), H = 210, pt = 18, pb = 26;
  const pl = rtl ? EDGE : AX, pr = rtl ? AX : EDGE;
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H); svg.setAttribute('width', W); svg.setAttribute('height', H);
  svg.innerHTML = ''; svg.classList.remove('hovering');
  const max = Math.max(goal || 0, ...bars.map(b => b.value), 10);
  const step = [10, 15, 20, 30, 60, 90, 120, 180, 240, 360, 480, 600, 900, 1200, 1800].find(s_ => max/s_ <= 4) || Math.ceil(max/4/60)*60;
  const top = Math.ceil(max/step)*step, ih = H - pt - pb, y = v => pt + ih - v/top*ih;
  const el = (tag, at) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); svg.appendChild(e); return e; };
  for (let v = 0; v <= top; v += step) {

    const tx = el('text', rtl ? {x:W - pr + 6, y:y(v) + 4, 'text-anchor':'start'} : {x:pl - 6, y:y(v) + 4, 'text-anchor':'end'});
    tx.textContent = v === 0 ? '0' : minLabel(v);

  const marks = [];

    const slot = rtl ? W - pr - band*(i + 1) : pl + band*i, cx = slot + band/2, x = cx - bw/2, yy = y(b.value), h = pt + ih - yy, r = Math.min(4, bw/2, h);
    const m = h > 0 ? el('path', {class:'barm', d:'M'+x+','+(pt+ih)+'V'+(yy+r)+'Q'+x+','+yy+' '+(x+r)+','+yy+'H'+(x+bw-r)+'Q'+(x+bw)+','+yy+' '+(x+bw)+','+(yy+r)+'V'+(pt+ih)+'Z'}) : null;
    if (m && !b.today) m.style.opacity = '.8';

    if (show) { const tx = el('text', {x:cx, y:H - 8, 'text-anchor':'middle'}); tx.textContent = short && b.wd !== undefined ? wdS[b.wd] : b.label; if (b.today) tx.style.fill = 'var(--ink)'; }
    const hit = el('rect', {class:'hit', x:slot, y:pt, width:band, height:ih});
    const on = () => { svg.classList.add('hovering'); marks.forEach(mm => mm && mm.classList.toggle('on', mm === m));
      $('chartRead').textContent = (b.long || b.label) + ': ' + (b.value ? fmtHuman(b.value*60) : '—'); };
    hit.addEventListener('pointerenter', on); hit.addEventListener('pointerdown', on);
  });
  svg.onpointerleave = () => { svg.classList.remove('hovering'); $('chartRead').textContent = ''; };
  if (goal > 0 && goal <= top) { el('line', {class:'goal', x1:pl, x2:W - pr, y1:y(goal), y2:y(goal)});
  }
  $('chartGoal').hidden = !(goal > 0); $('chartGoal').lastChild.textContent = t('goalLine') + ' ' + minLabel(goal);

}
function renderStats(){

  renderChips('goalChips', [30, 60, 90, 120, 180, 240], cfg.goal, v => minLabel(v), v => { cfg.goal = v; commit(); renderStats(); });

function importText(txt){
  try {
    const d = JSON.parse(txt);
    if (!d || d.app !== 'tarkizo' || !d.stats || !Array.isArray(d.stats.phases) || !Array.isArray(d.stats.runs) || !Array.isArray(d.tasks)) throw 0;
    stats = {phases:d.stats.phases.filter(x => x && isFinite(x.t) && isFinite(x.ms)), runs:d.stats.runs.filter(x => x && isFinite(x.t))};
    tasks = d.tasks.filter(x => x && x.id && x.name); curTask = d.curTask || null; todayCache = null;
    save('stats', stats); saveTasks(); renderStats(); dataMsg('imported'); $('dataBox').value = '';
  } catch(e){ dataMsg('importBad'); }
}
$('importGo').onclick = () => { if ($('dataBox').value.trim()) importText($('dataBox').value.trim()); else $('importFile').click(); };
$('importFile').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const r = new FileReader(); r.onload = () => importText(String(r.result)); r.onerror = () => dataMsg('importBad'); r.readAsText(f); e.target.value = '';
});
let clearArmed = 0;
$('clearBtn').onclick = () => {
  if (Date.now() - clearArmed > 4000) { clearArmed = Date.now(); $('clearBtn').textContent = t('clearConfirm'); $('clearBtn').classList.add('warn');
    setTimeout(() => { if (Date.now() - clearArmed >= 4000) { $('clearBtn').textContent = t('clearBtn'); $('clearBtn').classList.remove('warn'); } }, 4100); return; }
  try { Object.keys(localStorage).filter(k => k.indexOf(KEY) === 0).forEach(k => localStorage.removeItem(k)); } catch(e){}
  try { location.reload(); } catch(e){}
};
label('openStats', 'progress'); label('openSettings', 'settings');
renderTasks(); renderTaskLine();

// Settings tabs
const TABS = ['timer','tasks','look','sound'];
const cap = s => s[0].toUpperCase() + s.slice(1);
let tab = load('tab', 'timer');
function setTab(v){
  tab = TABS.includes(v) ? v : 'timer'; save('tab', tab);
  TABS.forEach(x => { $('tab'+cap(x)).hidden = x !== tab; $('tb'+cap(x)).setAttribute('aria-selected', String(x === tab)); });
  if (tab === 'look') renderLook();
  if (tab === 'sound') renderSound();
}
TABS.forEach(x => { $('tb'+cap(x)).onclick = () => setTab(x); });

// Language: Arabic is right-to-left, the other three left-to-right. The clock digits are always isolated left-to-right.
LANGS.forEach(([code, name]) => { const o = document.createElement('option'); o.value = code; o.textContent = name; o.lang = code === 'ku' ? 'kmr' : code; $('langSel').appendChild(o); });
$('langSel').value = lang;
function setLang(l){
  lang = T[l] ? l : 'ar'; save('lang', lang);
  $('langSel').value = lang;
  $('langSel').setAttribute('aria-label', t('langLabel'));
  applyText(); renderSetup(); renderSaved(); renderSound();
  if (!$('tabLook').hidden) renderLook();
  label('optBtn', 'options'); label('exitFocus', 'exitFocus'); label('drClose', 'close'); label('drGrip', 'resize'); updateFs(); renderHero();
  label('openStats', 'progress'); label('openSettings', 'settings'); renderTasks(); renderTaskLine(); if (statsOpen) renderStats();
  EVENTS.concat(['warn']).forEach(ev => $('try_'+ev).setAttribute('aria-label', t('play')));
  dotsKey = ''; $('ambToggle').textContent = ''; syncAmb();
  if (run) { if (run.status === 'done') renderDone(); else render(); }
  else document.title = 'TARKIZO';
}
$('langSel').addEventListener('change', e => setLang(e.target.value));
$('langSel').setAttribute('aria-label', t('langLabel'));
label('drClose', 'close'); label('drGrip', 'resize');
applyLook();
setTab(tab);
setDrawer(wideMQ.matches && !!load('drOpen', false), false);

/* ---------- Installable web app: install button, offline sounds (only on the real website, not inside a preview frame) ---------- */
(function(){
  let deferred = null, swReady = false;
  const standalone = (() => { try { return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; } catch(e){ return false; } })();
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let topLevel = true; try { topLevel = window.top === window; } catch(e){ topLevel = false; }
  function update(){
    $('installBtn').hidden = !deferred;
    $('iosHint').hidden = !(isIOS && !standalone && topLevel);
    $('offlineBtn').hidden = !swReady;
    $('appSec').hidden = $('installBtn').hidden && $('iosHint').hidden && $('offlineBtn').hidden;
  }
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; update(); });
  window.addEventListener('appinstalled', () => { deferred = null; update(); });
  $('installBtn').onclick = () => { if (!deferred) return; deferred.prompt(); Promise.resolve(deferred.userChoice).finally(() => { deferred = null; update(); }); };
  if (topLevel && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then(() => { swReady = true; update(); }).catch(() => {});
  }
  // Fetch every recording once; the service worker keeps them, so all sounds work without internet afterwards
  $('offlineBtn').onclick = async () => {
    const list = Object.values(FILES); let ok = 0;
    $('offlineBtn').disabled = true;
    for (const f of list) {
      $('offlineMsg').textContent = t('offlineProgress', {d:ok, n:list.length});
      try { const r = await fetch('sounds/' + f); if (r.ok) { await r.arrayBuffer(); ok++; } } catch(e){}
    }
    $('offlineMsg').textContent = t(ok === list.length ? 'offlineDone' : 'offlineFail');
    $('offlineBtn').disabled = false;
  };
  update();
})();

let lastPersist = 0;
setInterval(() => {
  if (!run || $('restore').hidden === false) return;
  const before = run.status + run.cycle;
  render();
  const changed = run && run.status + run.cycle !== before;
  if (changed && !$('run').hidden) pokeUi();
  if (run && (changed || Date.now() - lastPersist > 5000)) { lastPersist = Date.now(); persist(); }
}, 200);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && run && $('restore').hidden) { render(); persist(); if (!run.paused && run.status !== 'done') keepAwake(); }
});
window.addEventListener('pagehide', () => { if (run && $('restore').hidden) persist(); });

/* ---------- Start-up: offer to restore an unfinished session ---------- */
applyText();
renderSaved();
if (run && run.status && run.status !== 'done' && run.status !== 'idle') {
  focusView = false;
  show();
  $('home').hidden = false; $('hIdle').hidden = true; $('hLive').hidden = true; $('run').hidden = true; $('cd').hidden = true;
  renderSetup();
  const ph = run.status === 'countdown' ? run.pending.phase : run.status;
  const rem = run.status === 'countdown' ? (run.pending.phase === 'study' ? run.studySec : run.breakSec)*1000 : (run.paused ? run.remain : run.endAt - run.seen);
  $('restoreInfo').textContent = t('restoreInfo', {phase:t(ph === 'study' ? 'focus' : 'rest'), c:run.status === 'countdown' ? run.pending.cycle : run.cycle, n:run.total, rem:fmtClock(rem)});
  $('restore').hidden = false;
  $('restoreGo').onclick = () => {
    unlockAudio();
    const shift = Date.now() - (run.seen || Date.now());   // time the page was closed is not counted
    if (run.status === 'countdown') run.cdEndAt += shift;
    else if (!run.paused) run.endAt += shift;
    focusView = cfg.autoFocus;
    if (cfg.snd.ambAuto && hasMix()) ambOn = true;
    $('restore').hidden = true; persist(); if (!run.paused) keepAwake(); show();
  };
  $('restoreDrop').onclick = () => { run = null; persist(); $('restore').hidden = true; show(); };
} else {
  run = null; save('run', null);
  show();
}
})();
</script>
